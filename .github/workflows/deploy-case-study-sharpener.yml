# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy Case Study Sharpener

on:
  push:
    branches:
      - main
    paths:
      - 'px-case-study-sharpener/**'
      - '.github/workflows/deploy-case-study-sharpener.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: px-case-study-sharpener
        run: npm ci

      - name: Build frontend
        working-directory: px-case-study-sharpener
        run: npm run build

      - name: Create deploy package
        working-directory: px-case-study-sharpener
        run: |
          zip -r ../deploy.zip server.js package.json package-lock.json node_modules/ dist/ public/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: px-case-study-sharpener-bridge
          package: deploy.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CASE_STUDY }}
